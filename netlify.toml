[build]
	publish = "_site"
	command = "npm run build"

[[headers]]
	for = "/*"
	[headers.values]
		X-Content-Type-Options = "nosniff"
		Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'none'"
		Referrer-Policy = "strict-origin-when-cross-origin"
		Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
	for = "/fonts/*"
	[headers.values]
		Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
	from = "https://workshops.andypbrowne.com/img/*"
	to = "/img/:splat"
	status = 200
	force = true

[[redirects]]
	from = "https://workshops.andypbrowne.com/fonts/*"
	to = "/fonts/:splat"
	status = 200
	force = true

[[redirects]]
	from = "https://workshops.andypbrowne.com/*"
	to = "/workshops/:splat"
	status = 200
	force = true

[[redirects]]
	from = "https://sites.andypbrowne.com/img/*"
	to = "/img/:splat"
	status = 200
	force = true

[[redirects]]
	from = "https://sites.andypbrowne.com/fonts/*"
	to = "/fonts/:splat"
	status = 200
	force = true

[[redirects]]
	from = "https://sites.andypbrowne.com/*"
	to = "/sites/:splat"
	status = 200
	force = true

